<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Reserva de habitación</title>
    </head>
    <body>
        <p>Vamos a probar diferentes valores de type de HTML5 para la etiqueta <i>input</i></p>
        <form action="validar.php" method="get" novalidate>
            <fieldset>
                <legend>Para datos personales</legend>
                <label for="tel">Teléfono </label><input type="tel" name="tel" placeholder="000-000000" pattern="[0-9]{3}-[0-9]{6}" maxlength="10" autocomplete="tel"><br>
                <label for="mail">Correo electrónico </label><input type="email" maxlength="50" placeholder="El formato correcto es nombre+@+servidor de correo" autocomplete="email">
            </fieldset>
            <fieldset>
                <legend>Para valores numéricos</legend>
                <label for="personas">Número de personas </label><input type="number" min="1" max="20" step="1" value="1"><br>
                <label for="puntuacion">Desplace la barra para indicar puntuación </label><input id="puntuacion" type="range" min="1" max="10" step="1" value="0">
            </fieldset>
            <fieldset>
                <legend>Url y búsqueda</legend>
                <label for="url">Url de tu sitio </label><input id="url" type="url"><br>
                <label for="busqueda">¿Qué te interesa buscar? </label><input id="busqueda" type="search">
            </fieldset>
            <fieldset>
                <legend>Otros tipos</legend>
                <label for="color">Color </label><input type="color">
            </fieldset>
            <fieldset>
                <legend>Para fechas</legend>
                <label for="dia">Seleccione un día (Hasta fin de año): </label><input id="dia" type="date" max="2026-12-31"><br>
                <label for="hora">Seleccione una hora: </label><input id="hora" type="time"><br>
                <label for="mes">Seleccione un mes (Hasta junio del 2020): </label><input id="mes" type="month" max="2020-07-31"><br>
                <label for="semana">Seleccione una semana (Hasta junio del 2020): </label><input id="semana" type="week" max="2020-07-31"><br>
                <label for="fechaHora">Seleccione una fecha y hora: </label><input id="fechaHora" type="datetime-local">
            </fieldset>
            <button type="submit">Entrar</button>
            <button type="reset">Limpiar</button>
        </form>
    </body>
</html>
