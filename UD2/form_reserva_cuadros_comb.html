<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Reserva de habitación</title>
    </head>
    <body>
        <form action="reserva.php" method="get">
            <fieldset>
                <legend>Datos del solicitante</legend>
                <label for="nombre">Nombre del solicitante de la reserva</label><br>
                <input type="text" id="nombre" style="width: 90%;" required><br>
                <label for="tel">Teléfono de contacto </label><input type="tel" placeholder="9 números" required><br>
                <label for="dni">DNI (Seleccione un archivo de imagen) </label> <input type="file" accept="image/*" multiple required>
            </fieldset>
            <fieldset>
                <legend>Datos de la reserva</legend>
                <label for="habitacion">Habitación</label><br>
                <select size="4" name="habitacion" required>
                    <option value="Azul" selected>Azul</option>
                    <option value="Verde">Verde</option>
                    <option value="Amarilla">Amarilla</option>
                    <option value="Morada">Morada</option>
                </select><br>
                <label for="ocupacion">Ocupación</label><br>
                <select size="2" name="ocupacion" required>
                    <option value="Individual">Individual</option>
                    <option value="Doble" selected>Doble</option>
                </select><br>
                <select id="provincia" required>
                    <optgroup label="Galicia">
                        <option value="La Coruña">La Coruña</option>
                        <option value="Lugo">Lugo</option>
                        <option value="Orense">Orense</option>
                        <option value="Pontevedra">Pontevedra</option>
                    </optgroup>
                    <optgroup label="País Vasco">
                        <option value="Vizcaya">Vizcaya</option>
                        <option value="Guipúzcoa">Guipúzcoa</option>
                        <option value="Álava">Álava</option>
                    </optgroup>
                </select>
            </fieldset>
            <input type="submit" Value="Entrar">
            <input type="reset" value="Limpiar">
        </form>
    </body>
</html>
