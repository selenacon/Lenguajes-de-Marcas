<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 16</title>
    </head>
    <body>
        <h1>Patatas fritas</h1>
        <hr>
        <figure><img src="img/patatas-fritas.png" style="width: 288px; height: 185px;">
            <figcaption>Patatas fritas caseras</figcaption></figure>
        <h2>Ingredientes</h2>
        <ul>
            <li>3 ó 4 patatas (300g.)</li>
            <li>4 dientes de ajo</li>
            <li>Aceite de oliva</li>
            <li>Sal</li>
        </ul>
        <h2>Elaboración (Pasos)</h2>
        <ol>
            <li>Calentar aceite en una sartén.</li>
            <li>Añadir patatas cortadas, la sal y los ajos.</li>
            <li>Freír al gusto.</li>
            <li>Servir en plato.</li>
        </ol>
    </body>
</html>
